<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://nmjoenqkjyhngjvdealh.supabase.co https://*.tile.openstreetmap.org; media-src 'self' blob: https://nmjoenqkjyhngjvdealh.supabase.co; connect-src 'self' https://nmjoenqkjyhngjvdealh.supabase.co wss://nmjoenqkjyhngjvdealh.supabase.co https://nominatim.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DCR Portal 2 — Log History</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="theme-color" content="#0f8b7d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portal 2" />
    <script src="js/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <style>
      .lg{--acc:#2f80d8; --tint:rgba(47,128,216,0.12); --tint-2:rgba(47,128,216,0.22);
        max-width:900px; margin:0 auto; padding:14px 16px 60px;}
      .lg-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
      .lg-head h2{margin:0; font-size:19px; color:var(--text);}
      .lg-search{flex:1; min-width:170px; max-width:320px; padding:8px 12px; font-size:14px;
        border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text);}
      .lg-search:focus{outline:none; border-color:var(--acc);}
      .lg-btn{padding:8px 14px; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer;
        border:1px solid var(--border); background:var(--surface); color:var(--text);}
      .lg-btn:hover{background:var(--surface-2);}
      .lg-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
      .lg-chip{padding:6px 13px; border-radius:15px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;
        border:1px solid var(--border); background:var(--surface); color:var(--text-muted); user-select:none;}
      .lg-chip.on{background:var(--acc); border-color:var(--acc); color:#fff;}
      .lg-sub{font-size:12px; color:var(--text-muted); margin-bottom:12px; min-height:14px;}
      .lg-proj{background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; overflow:hidden;}
      .lg-proj-head{display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--tint); cursor:pointer; text-decoration:none;}
      .lg-proj-head:hover{background:var(--tint-2);}
      .lg-proj-name{font-weight:800; color:var(--acc); font-size:14px;}
      .lg-proj-sub{font-size:11.5px; color:var(--text-muted); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
      .lg-count{background:var(--surface-2); color:var(--text-muted); border-radius:12px; padding:1px 9px; font-size:11px; font-weight:700;}
      .lg-entry{padding:9px 14px; border-top:1px solid var(--border);}
      .lg-entry.sys .lg-text{color:var(--text-muted);}
      .lg-when{font-size:10.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:3px;}
      .lg-text{font-size:13px; color:var(--text); line-height:1.5; white-space:pre-wrap; word-break:break-word;}
      .lg-user{font-size:10.5px; color:var(--text-muted); margin-top:3px;}
      .lg-more{background:none; border:none; padding:0; color:var(--acc); font-size:12px; cursor:pointer;}
      .lg-empty{padding:36px; text-align:center; color:var(--text-muted);}
    </style>
  </head>
  <body>
    <div class="topbar" id="dcr2Topbar"></div>

    <div class="lg">
      <div class="lg-head">
        <h2>📜 Log History</h2>
        <input class="lg-search" id="lgSearch" type="search" list="lgProjects"
          placeholder="Search a project (ID, name, client)…" autocomplete="off" aria-label="One project's history" />
        <datalist id="lgProjects"></datalist>
        <button class="lg-btn" id="lgRefresh" type="button" aria-label="Refresh" title="Read again">↻</button>
      </div>
      <div class="lg-chips" id="lgChips" role="group" aria-label="Time window"></div>
      <div class="lg-sub" id="lgSub" role="status"></div>
      <div id="lgList"><div class="lg-empty">Loading…</div></div>
    </div>

    <script type="module" src="js/pages/logs.js"></script>
  </body>
</html>
