<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://nmjoenqkjyhngjvdealh.supabase.co https://*.tile.openstreetmap.org; media-src 'self' blob: https://nmjoenqkjyhngjvdealh.supabase.co; connect-src 'self' https://nmjoenqkjyhngjvdealh.supabase.co wss://nmjoenqkjyhngjvdealh.supabase.co https://nominatim.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DCR Portal 2 — Home</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="theme-color" content="#0f8b7d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portal 2" />
    <script src="js/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <script type="module" src="js/shell/dashboard.js"></script>
    <style>
      .hm {
        --acc: var(--p2); --acc-2: var(--p2-dark); --tint: var(--p2-tint);
        max-width: 960px; margin: 0 auto; padding: 26px 16px 60px;
      }
      .hm-hero { text-align: center; margin-bottom: 26px; }
      .hm-hero .mark { background: #fff; border-radius: 16px; padding: 10px; display: inline-flex;
        box-shadow: 0 1px 5px rgba(0,0,0,.18); margin-bottom: 12px; }
      .hm-hero .mark img { height: 64px; width: auto; }
      .hm-hero h2 { margin: 0 0 4px; font-size: 24px; color: var(--text); }
      .hm-hero p { margin: 0 0 18px; font-size: 14px; color: var(--text-muted); }
      .hm-searchwrap { position: relative; max-width: 560px; margin: 0 auto; }
      .hm-search {
        width: 100%; box-sizing: border-box; padding: 14px 52px 14px 18px; font-size: 16px;
        border: 2px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text);
      }
      .hm-search:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 4px var(--tint); }
      .hm-searchbtn {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        border: none; background: var(--acc); color: #fff; border-radius: 10px;
        padding: 8px 14px; font-size: 15px; cursor: pointer;
      }
      .hm-searchbtn:hover { background: var(--acc-2); }
      .hm-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
      .hm-card {
        display: flex; flex-direction: column; gap: 6px;
        background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
        padding: 16px; transition: border-color .12s, box-shadow .12s, transform .06s;
      }
      .hm-card .hm-card-go { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; flex: 1; }
      .hm-card:hover { border-color: var(--acc); box-shadow: 0 3px 14px rgba(0,0,0,.12); transform: translateY(-1px); }
      .hm-card.info:hover { border-color: var(--border); box-shadow: none; transform: none; }
      .hm-card .ic { font-size: 26px; line-height: 1; }
      .hm-card .tt { font-size: 15px; font-weight: 700; color: var(--text); }
      .hm-card .ds { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
      /* "3 need an update" on My Tasks: red, because it is somebody's job today */
      .hm-badge { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px; font-size: 11px;
        font-weight: 700; background: #2f80d8; color: #fff; vertical-align: 2px; }
      .hm-badge.dim { background: var(--surface-2); color: var(--text-muted); }
      .hm-badge.warn { background: var(--danger); color: #fff; }
      .hm-card .links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
      .hm-card .links a { font-size: 11px; font-weight: 600; color: var(--acc); text-decoration: none;
        padding: 2px 8px; border: 1px solid var(--border); border-radius: 10px; }
      .hm-card .links a:hover { background: var(--tint); }
      .hm-sec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
        color: var(--text-muted); margin: 22px 0 10px; }
      .hm-note { border: 1px solid var(--border); border-left: 4px solid var(--p2); border-radius: 12px;
        background: var(--surface); padding: 12px 14px; font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
      .hm-note b { color: var(--text); }
      /* an admin's line about DCR Agents 2's PC (rpc agents_server_status) */
      .hm-agents { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted);
        border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 9px 14px; margin-bottom: 14px; }
      .hm-agents .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa5b1; flex: none; }
      .hm-agents.ok .dot { background: #1f9d55; }
      .hm-agents.warn .dot { background: #d4a017; }
    </style>
  </head>
  <body>
    <div class="topbar" id="dcr2Topbar"></div>
    <main class="hm">
      <div class="hm-hero">
        <span class="mark"><img id="hmLogo" src="icons/logo.jpg" alt="" /></span>
        <h2 id="hmGreeting">Welcome</h2>
        <p>Search projects, contacts, tasks and files.</p>
        <form class="hm-searchwrap" id="hmSearchForm" role="search">
          <input id="hmSearch" class="hm-search" type="search" placeholder="Search the projects database…" autocomplete="off" aria-label="Search" />
          <button class="hm-searchbtn" id="hmGo" type="submit" aria-label="Search">🔍</button>
        </form>
        <div id="installSlot" style="margin-top:14px"></div>
        <div id="pushSlot" style="margin-top:10px"></div>
      </div>
      <div id="hmAgents" hidden></div>
      <div id="hmNotes"></div>
      <div id="hmSections"></div>
    </main>
  </body>
</html>
