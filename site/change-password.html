<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://nmjoenqkjyhngjvdealh.supabase.co https://*.tile.openstreetmap.org; media-src 'self' blob: https://nmjoenqkjyhngjvdealh.supabase.co; connect-src 'self' https://nmjoenqkjyhngjvdealh.supabase.co wss://nmjoenqkjyhngjvdealh.supabase.co https://nominatim.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DCR Portal 2 — Choose your password</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="theme-color" content="#0f8b7d" />
    <meta name="apple-mobile-web-app-title" content="Portal 2" />
    <script src="js/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <script type="module" src="js/shell/change-password.js"></script>
    <style>
      .auth-card { border-top: 4px solid var(--p2); max-width: 420px; }
      .auth-card h1 { font-size: 19px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .cp-who { font-size: 13px; color: var(--text-muted); margin: 0 0 4px; }
      .cp-rule { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
      .auth-card .btn-block { background: var(--p2); }
      .auth-card .btn-block:hover { background: var(--p2-dark); }
      .cp-out { margin-top: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="auth-wrap">
      <form class="auth-card" id="cpForm" autocomplete="on" novalidate hidden>
        <h1>Choose your password <span class="p2-badge">Portal 2</span></h1>
        <p class="cp-who" id="cpWho"></p>
        <p class="subtitle" id="cpWhy">You signed in with a temporary password from the office. Choose your own to go on.</p>

        <input type="email" id="cpEmail" autocomplete="username" hidden />
        <label for="cpCur" id="cpCurLabel">Temporary password</label>
        <input id="cpCur" type="password" autocomplete="current-password" required />

        <label for="cpNew">New password</label>
        <input id="cpNew" type="password" autocomplete="new-password" required />
        <label for="cpNew2">New password again</label>
        <input id="cpNew2" type="password" autocomplete="new-password" required />
        <div class="cp-rule">At least 10 characters, with letters and digits. Your other devices are signed out when it changes.</div>

        <button class="btn btn-block" type="submit" id="cpBtn">Save my password</button>
        <div class="msg error" id="cpErr" role="alert"></div>
        <div class="cp-out"><button type="button" class="linkish" id="cpOut">Sign out</button></div>
      </form>
    </div>
  </body>
</html>
