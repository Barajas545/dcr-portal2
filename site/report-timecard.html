<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://nmjoenqkjyhngjvdealh.supabase.co https://*.tile.openstreetmap.org; media-src 'self' blob: https://nmjoenqkjyhngjvdealh.supabase.co; connect-src 'self' https://nmjoenqkjyhngjvdealh.supabase.co wss://nmjoenqkjyhngjvdealh.supabase.co https://nominatim.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DCR Portal 2 — Time Card</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <script src="js/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <style>
      .rp-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; background:var(--surface);
        border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;}
      .rp-btn{padding:8px 14px; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer; font-family:inherit;
        border:1px solid var(--border); background:var(--surface); color:var(--text); text-decoration:none;}
      .rp-btn:hover{background:var(--surface-2);}
      .rp-btn-primary{background:#2f80d8; border-color:#2f80d8; color:#fff;}
      .rp-sel{padding:8px 11px; font-size:13px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); color-scheme:light dark; width:auto; max-width:100%;}
      .tc-grp{display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap;}
      .rp-lbl{margin:0; font-size:12.5px; color:var(--text-muted); display:inline;}
      .rp-badge{font-size:10.5px; font-weight:800; letter-spacing:.04em; padding:2px 8px; border-radius:9px; background:#0f766e; color:#fff;}
      .rp-loading{text-align:center; color:#666; padding:60px 0;}
      .sheet{max-width:8.5in; margin:18px auto; background:#fff; color:#111; padding:0.6in 0.7in; box-shadow:0 3px 20px rgba(0,0,0,.25);
        font-family:Arial,Helvetica,sans-serif; font-size:12.5px; line-height:1.4; box-sizing:border-box;}
      .lh{display:flex; align-items:center; justify-content:space-between; gap:14px; border-bottom:3px solid #111; padding-bottom:12px; margin-bottom:14px;}
      .lh img{height:44px; width:auto;}
      .lh h1{margin:0; font-size:22px; letter-spacing:.12em;}
      .lh .co{font-size:9.5px; color:#333; line-height:1.5; text-align:center;}
      .who{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; font-size:13px;}
      .who b{font-size:15px;}
      table.tc{width:100%; border-collapse:collapse;}
      .tc th{border:1px solid #111; background:#f0f0f0; color:#111; padding:6px 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; position:static; white-space:nowrap;}
      .tc td{border:1px solid #555; padding:6px 8px; vertical-align:top; white-space:normal; max-width:none; overflow:visible; color:#111;}
      .tc tbody tr:hover{background:none;}
      .tc td.num{text-align:right; white-space:nowrap; width:70px;}
      .tc tr.tot td{font-weight:700; background:#f0f0f0; border-top:2px solid #111; font-size:13.5px;}
      .tc .sub{font-size:10.5px; color:#555;}
      .tc hr{border:none; border-top:1px dashed #bbb; margin:4px 0;}
      .leave{font-style:italic; color:#444;}
      .sig{display:flex; gap:40px; margin-top:36px;}
      .sig div{flex:1; border-top:1px solid #111; padding-top:5px; font-size:11px; color:#333;}
      .foot{margin-top:20px; font-size:10px; color:#777; text-align:center;}
      @media (max-width: 700px) { .sheet{padding:0.3in; margin:10px 8px;} .lh{flex-wrap:wrap;} .lh h1{font-size:18px;} }
      @media print{
        .rp-controls{display:none !important;}
        body{background:#fff !important;}
        .sheet{box-shadow:none; margin:0; max-width:none; padding:0;}
        @page{margin:0.6in 0.65in;}
      }
    </style>
  </head>
  <body>
    <div class="rp-controls">
      <a class="rp-btn" id="tcBack" href="timesheet.html">← Back</a>
      <span class="rp-badge">Portal 2</span>
      <span class="tc-grp"><label for="tcEmp" class="rp-lbl">Employee</label>
      <select id="tcEmp" class="rp-sel"></select></span>
      <span class="tc-grp"><label for="tcWeek" class="rp-lbl">Week</label>
      <select id="tcWeek" class="rp-sel">
        <option value="this">This week</option>
        <option value="last">Last week</option>
        <option value="pick">Another week…</option>
      </select>
      <input type="date" id="tcDate" class="rp-sel" hidden aria-label="Any day of the week" /></span>
      <button class="rp-btn rp-btn-primary" id="tcPrint" type="button" style="margin-left:auto">🖨 Print / Save PDF</button>
    </div>

    <div id="tcSheet" class="sheet"><div class="rp-loading">Loading…</div></div>

    <script type="module" src="js/pages/report-timecard.js"></script>
  </body>
</html>
