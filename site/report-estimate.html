<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://nmjoenqkjyhngjvdealh.supabase.co https://*.tile.openstreetmap.org; media-src 'self' blob: https://nmjoenqkjyhngjvdealh.supabase.co; connect-src 'self' https://nmjoenqkjyhngjvdealh.supabase.co wss://nmjoenqkjyhngjvdealh.supabase.co https://nominatim.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DCR Portal 2 — Estimate</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <script src="js/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <style>
      /* the controls follow the theme; the sheet is always paper (port of the old report-estimate.html) */
      .rp-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; background:var(--surface);
        border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;}
      .rp-btn{padding:8px 14px; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer; font-family:inherit;
        border:1px solid var(--border); background:var(--surface); color:var(--text); text-decoration:none;}
      .rp-btn:hover{background:var(--surface-2);}
      .rp-btn-primary{background:#2f80d8; border-color:#2f80d8; color:#fff;}
      .rp-btn-primary:hover{background:#1f6fc8;}
      select.rp-btn{width:auto; max-width:100%;}
      .rp-badge{font-size:10.5px; font-weight:800; letter-spacing:.04em; padding:2px 8px; border-radius:9px; background:#0f766e; color:#fff;}
      .rp-check{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text); cursor:pointer; margin:0;}
      /* the global stylesheet makes inputs width:100%: checkboxes keep their natural size (iOS honours the 100%) */
      .rp-check input{width:16px; height:16px; min-width:16px; padding:0; margin:0; accent-color:#2f80d8; flex-shrink:0;}
      .rp-check[hidden], .rp-btn[hidden]{display:none;}
      .rp-note{font-size:12px; color:var(--text-muted); padding:8px 16px; line-height:1.5; background:var(--surface-2); border-bottom:1px solid var(--border);}
      .rp-note[hidden]{display:none;}
      .rp-loading{text-align:center; color:var(--text-muted); padding:60px 0;}
      .rp-print{margin-left:auto;}

      .sheet{max-width:8.5in; margin:18px auto; background:#fff; color:#111; padding:0.7in 0.75in; box-shadow:0 3px 20px rgba(0,0,0,.25);
        font-family:Georgia,"Times New Roman",serif; font-size:13px; line-height:1.45; box-sizing:border-box;}
      .sheet a{color:#111; text-decoration:none;}
      .sheet p{margin:0;}
      .lh{display:flex; align-items:center; justify-content:space-between; gap:14px; border-bottom:3px solid #111; padding-bottom:14px; margin-bottom:18px;}
      .lh img{height:52px; width:auto;}
      .lh .co{font-size:11px; text-align:right; color:#333; line-height:1.5;}
      .rp-title{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;}
      .rp-title h1{margin:0; font-size:26px; letter-spacing:.14em; font-weight:700; color:#111;}
      .rp-title .meta{font-size:12px; text-align:right; color:#333;}
      .doc-tag{display:inline-block; margin-top:6px; padding:3px 9px; border:2px solid #111; border-radius:4px; font-size:10.5px; font-weight:700;
        letter-spacing:.08em; font-family:Arial,Helvetica,sans-serif;}
      .doc-tag-danger{border-color:#b3261e; color:#b3261e;}
      .blocks{display:flex; gap:24px; margin-bottom:18px;}
      .blk{flex:1; border:1px solid #999; border-radius:4px; padding:9px 12px;}
      .blk h4{margin:0 0 5px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#555;}
      .blk div{font-size:12.5px;}
      .h2{font-size:17px; font-weight:700; margin:4px 0 4px !important;}
      .h3{font-size:14px; font-weight:700; margin:0 0 4px !important;}
      .muted{color:#555;}
      .sheet > .muted{margin-bottom:10px !important;}

      table.est{width:100%; border-collapse:collapse; margin:10px 0 16px;}
      .est th{border-bottom:2px solid #111; padding:6px 8px; text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
        background:none; color:#111; position:static;}
      .est th.amt, .est td.amt{text-align:right; white-space:nowrap; width:118px;}
      .est td{padding:6px 8px; border-bottom:1px solid #ddd; vertical-align:top; color:#111; background:none;}
      /* styles.css cuts every cell to one line: the printed estimate shows each description in full */
      .est td:not(.amt), .est th:not(.amt), .tot td:not(.amt){white-space:normal; max-width:none; overflow:visible; text-overflow:clip; overflow-wrap:anywhere;}
      .est tr.grp td{background:#f0f0f0; font-weight:700; font-size:12.5px; border-bottom:1px solid #999; padding-top:9px;}
      .est tr.estb td{background:#e3e3e3; font-weight:700; font-size:13.5px; border-bottom:1px solid #999;}
      .est tr.sub td{font-weight:700; border-bottom:2px solid #999; background:#fafafa; text-align:right;}
      .est tr.sub td.amt{text-align:right;}
      .est .it{font-weight:600;}
      .detail{font-size:11px; color:#555;}
      .note{font-size:11px; color:#7a4a00; font-style:italic; margin-top:2px !important;}
      .empty{color:#777; font-style:italic;}
      .group-block{break-inside:avoid;}
      /* the totals (a change order's contract figures: original, previous, this one, NEW CONTRACT TOTAL) never split */
      table.tot{border-collapse:collapse; margin:0 0 18px auto; min-width:46%; break-inside:avoid; page-break-inside:avoid;}
      .tot td{padding:5px 8px; color:#111; background:none; border:none;}
      .tot td.amt{text-align:right; white-space:nowrap; width:130px;}
      .tot tr.strong td{font-weight:700;}
      .tot tr.grand td{font-weight:700; font-size:15px; border-top:3px double #111; padding-top:8px;}
      .terms{border:1px solid #999; border-radius:4px; padding:10px 13px; font-size:11.5px; margin-bottom:18px; min-height:40px;}
      .terms:focus{outline:2px solid #2f80d8;}
      .terms h4{margin:0 0 5px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#555;}
      .sig{display:flex; gap:40px; margin-top:30px;}
      .sig div{flex:1; border-top:1px solid #111; padding-top:5px; font-size:11px; color:#333;}
      .foot{margin-top:26px; font-size:10px; color:#777; text-align:center;}
      /* a change order is the shortest client document: drawn tighter so that one or two items, the contract figures,
         the approval and the three signature lines fit one Letter page; the approval and its signatures never split */
      .co-sign{break-inside:avoid; page-break-inside:avoid;}
      .co-two{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:stretch;}
      .co-two .terms{margin-bottom:0;}
      .co-sheet .lh{padding-bottom:9px; margin-bottom:12px;}
      .co-sheet .lh img{height:44px;}
      .co-sheet .lh .co{line-height:1.32;}
      .co-sheet .rp-title{margin-bottom:8px;}
      .co-sheet .rp-title h1{font-size:23px;}
      .co-sheet .blocks{margin-bottom:12px;}
      .co-sheet .blk{padding:6px 10px;}
      .co-sheet .blk div{font-size:12px; line-height:1.35;}
      .co-sheet table.est{margin:6px 0 10px;}
      .co-sheet table.tot{margin-bottom:12px;}
      .co-sheet .tot td{padding:3px 8px;}
      .co-sheet .terms{padding:8px 12px;}
      .co-sheet .sig{margin-top:22px;}
      .co-sheet .foot{margin-top:12px;}

      /* a phone's screen only: in print the page box (Letter, 7.2 in = 691 px between the margins) is narrower than
         700 px too, and these rules stacked the letterhead and the blocks - a one-item change order ran onto page 2 */
      @media screen and (max-width:700px){
        .sheet{margin:10px 8px; padding:18px 14px; font-size:12.5px;}
        .lh{flex-direction:column; align-items:flex-start;}
        .lh .co{text-align:left;}
        .rp-title{flex-direction:column;}
        .rp-title .meta{text-align:left;}
        .blocks{flex-direction:column; gap:10px;}
        .est th.amt, .est td.amt{width:92px;}
        .sig{gap:16px;}
        table.tot{min-width:0; width:100%;}
        .co-two{grid-template-columns:1fr;}
      }
      @media print{
        .rp-controls, .rp-note, .topbar{display:none !important;}
        body{background:#fff !important;}
        .sheet{box-shadow:none; margin:0; max-width:none; padding:0;}
        .terms:focus{outline:none;}
        *{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;}
        @page{margin:0.6in 0.65in;}
        thead{display:table-header-group;}
        tr{break-inside:avoid;}
      }
    </style>
  </head>
  <body>
    <div class="rp-controls">
      <a class="rp-btn" id="rpBack" href="board.html">← Back</a>
      <span class="rp-badge">Portal 2</span>
      <select id="rpEst" class="rp-btn" aria-label="Which estimate" hidden></select>
      <label class="rp-check" id="rpNoPricesBox" hidden><input type="checkbox" id="rpNoPrices" /> Hide prices (worksite copy)</label>
      <label class="rp-check"><input type="checkbox" id="rpSimple" /> Simple (no item detail)</label>
      <label class="rp-check" id="rpNotesBox" hidden><input type="checkbox" id="rpNotes" /> Internal notes</label>
      <button class="rp-btn rp-btn-primary rp-print" id="rpPrint" type="button">🖨 Print / Save PDF</button>
    </div>
    <div class="rp-note" id="rpNote" hidden></div>

    <div id="rpSheet" class="sheet"><div class="rp-loading">Loading estimate…</div></div>

    <script type="module" src="js/pages/report-estimate.js"></script>
  </body>
</html>
