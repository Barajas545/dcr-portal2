<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://nmjoenqkjyhngjvdealh.supabase.co https://*.tile.openstreetmap.org; media-src 'self' blob: https://nmjoenqkjyhngjvdealh.supabase.co; connect-src 'self' https://nmjoenqkjyhngjvdealh.supabase.co wss://nmjoenqkjyhngjvdealh.supabase.co https://nominatim.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DCR Portal 2 — Project</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="theme-color" content="#0f8b7d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portal 2" />
    <script src="js/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <style>
      :root{--acc:#2f80d8; --acc-2:#1f6fc8; --tint:rgba(47,128,216,0.12); --tint-2:rgba(47,128,216,0.22);
        --gold:#d6a13a; --ok:#2fa679; --err:#d9614f;}
      .pj{max-width:1160px; margin:0 auto; padding:14px 16px 60px;}
      /* header */
      .pj-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
      .pj-thumb{width:92px; height:60px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
        flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:10px; overflow:hidden;}
      .pj-thumb img{width:100%; height:100%; object-fit:cover;}
      .pj-title{font-size:19px; font-weight:800; color:var(--text); line-height:1.25;}
      .pj-sub{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
      .pj-status{display:inline-block; padding:3px 11px; border-radius:14px; font-size:12px; font-weight:700;
        background:var(--tint); color:var(--st,var(--acc)); border:1px solid var(--st,var(--acc));}
      .pj-status select{background:none; border:none; color:inherit; font:inherit; cursor:pointer; padding:0; width:auto; box-shadow:none;}
      .pj-switch input{padding:8px 12px; font-size:13px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); width:210px;}
      .pj-switch input:focus{outline:none; border-color:var(--acc);}
      .pj-btn{padding:8px 14px; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer;
        border:1px solid var(--border); background:var(--surface); color:var(--text); text-decoration:none; display:inline-block;}
      .pj-btn:hover{background:var(--surface-2);}
      .pj-btn[hidden]{display:none;}
      .pj-btn-primary{background:var(--acc); border-color:var(--acc); color:#fff;}
      .pj-btn-primary:hover{background:var(--acc-2);}
      .pj-btn-primary:disabled{background:#7a8595; border-color:#7a8595; cursor:default;}
      .pj-btn-sm{padding:5px 10px; font-size:12px;}
      .pj-msg{font-size:12.5px; min-height:16px;}
      .pj-msg.ok{color:var(--ok);} .pj-msg.err{color:var(--err);}
      .pj-here{display:flex; gap:0; align-items:center;}
      .pj-here[hidden]{display:none;}
      .pj-av{position:relative; width:28px; height:28px; border-radius:50%; color:#fff; font-size:11px; font-weight:800;
        display:inline-flex; align-items:center; justify-content:center; border:2px solid var(--surface); margin-left:-6px;}
      .pj-av:first-child{margin-left:0;}
      .pj-av.more{background:var(--surface-2); color:var(--text-muted);}
      .pj-av-pen{position:absolute; right:-4px; bottom:-4px; font-style:normal; font-size:10px; background:var(--gold); color:#000;
        border-radius:50%; width:14px; height:14px; display:flex; align-items:center; justify-content:center;}
      .pj-editing{background:rgba(214,161,58,.16); border:1px solid var(--gold); color:var(--text); border-radius:9px; padding:7px 12px; font-size:13px; margin-bottom:10px;}
      .pj-editing[hidden]{display:none;}

      /* tabs */
      .pj-tabs{display:flex; gap:4px; border-bottom:2px solid var(--border); margin:8px 0 16px; overflow-x:auto; scrollbar-width:none;}
      .pj-tab{padding:9px 15px; font-size:13.5px; font-weight:600; color:var(--text-muted); background:none; border:none;
        border-bottom:2px solid transparent; margin-bottom:-2px; cursor:pointer; white-space:nowrap;}
      .pj-tab:hover{color:var(--text);}
      .pj-tab.active{color:var(--acc); border-bottom-color:var(--acc);}
      .pj-pane{display:none;}
      .pj-pane.active{display:block;}

      /* overview */
      .pj-sec{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px;}
      .pj-sec h3{margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);}
      .pj-auto{float:right; font-size:10.5px; font-weight:600; text-transform:none; letter-spacing:0; color:var(--ok);}
      .pj-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px 14px;}
      .pj-f label{display:block; font-size:11.5px; font-weight:600; color:var(--text-muted); margin:0 0 3px;}
      .pj-f input,.pj-f select,.pj-f textarea{width:100%; box-sizing:border-box; padding:8px 10px; font-size:13.5px;
        border:1px solid var(--border); border-radius:7px; background:var(--surface); color:var(--text); color-scheme:light dark;}
      .pj-f input:focus,.pj-f select:focus,.pj-f textarea:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 2px var(--tint-2);}
      .pj-f input:disabled,.pj-f textarea:disabled,.pj-f select:disabled{background:var(--surface-2); color:var(--text-muted);}
      .pj-f.full{grid-column:1/-1;}
      .pj-f textarea{resize:vertical; min-height:64px; overflow-y:hidden;}
      .pj-ro{font-size:12.5px; color:var(--text-muted); background:var(--surface-2); border-left:3px solid var(--border);
        border-radius:0 8px 8px 0; padding:8px 12px; margin-bottom:12px;}
      .pj-clash{font-size:12px; color:var(--text); background:rgba(214,161,58,.16); border-left:3px solid var(--gold); border-radius:0 7px 7px 0; padding:6px 8px; margin-top:4px;}
      .pj-clash[hidden]{display:none;}
      .pj-check{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); padding:7px 4px; cursor:pointer; margin:0;}
      .pj-check input{width:16px; height:16px; accent-color:var(--acc);}
      .pj-links{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
      .pj-tagwrap{display:flex; gap:6px; flex-wrap:wrap;}
      .pj-tag{padding:5px 12px; border-radius:15px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
        border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); user-select:none;}
      .pj-tag.on{background:var(--tint-2); border-color:var(--acc); color:var(--acc);}
      .pj-tag.disabled{cursor:default; opacity:.75;}
      .pj-row{margin-top:8px; display:flex; gap:8px; align-items:center;}
      .pj-ta{width:100%; box-sizing:border-box; min-height:64px; padding:9px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text);}

      /* journal */
      .pj-jrn{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 15px; margin-bottom:10px;}
      .pj-jrn-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
      .pj-jrn-who{margin-left:auto;}
      .pj-jrn-flag{border-color:var(--gold); color:var(--gold);}
      .pj-jrn-h{font-size:14.5px; font-weight:700; color:var(--text); margin-bottom:4px;}
      .pj-jrn-body{font-size:13.5px; color:var(--text); line-height:1.55; white-space:pre-wrap;}
      .pj-jrn-meta{margin-top:6px;}
      .pj-jrn-row{margin-top:10px;}
      .pj-jrn-auto{float:right; font-size:10.5px; font-weight:600; text-transform:none; letter-spacing:0; color:var(--ok);}
      .pj-jrn-auto.err{color:var(--err);}
      .pj-jrn-media{display:flex; flex-wrap:wrap; gap:10px; margin-top:9px;}
      .pj-jrn-fig{margin:0; width:132px; display:flex; flex-direction:column; gap:4px;}
      .pj-jrn-thumb{position:relative; width:132px; height:99px; border-radius:8px; overflow:hidden; background:var(--surface-2);
        border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}
      .pj-jrn-thumb[data-open]{cursor:pointer;}
      .pj-jrn-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
      .pj-jrn-ph{font-size:26px; opacity:.6;}
      .pj-jrn-play{position:absolute; color:#fff; font-size:19px; text-shadow:0 1px 6px rgba(0,0,0,.75); pointer-events:none;}
      .pj-jrn-up{position:absolute; bottom:0; left:0; right:0; font-size:9.5px; text-align:center; padding:2px 0; background:rgba(0,0,0,.62); color:#fff;}
      .pj-jrn-up.err{background:var(--err); cursor:pointer;}
      .pj-jrn-bar{position:absolute; left:0; right:0; bottom:14px; height:3px; background:rgba(255,255,255,.28);}
      .pj-jrn-bar i{display:block; height:100%; background:var(--ok); transition:width .18s linear;}
      .pj-jrn-fig figcaption{font-size:11.5px; color:var(--text-muted); line-height:1.35; word-break:break-word;}
      .pj-jrn-cap{width:100%; box-sizing:border-box; padding:4px 6px; font-size:11.5px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text);}
      .pj-jrn-cap.err{border-color:var(--err);}
      .pj-jrn-auto.wait{color:var(--gold);}
      .pj-jrn-x{position:absolute; top:4px; right:4px; width:26px; height:26px; border-radius:50%; border:0; padding:0;
        background:rgba(0,0,0,.62); color:#fff; font-size:13px; line-height:26px; text-align:center; cursor:pointer;}
      .pj-jrn-x:hover, .pj-jrn-x:focus-visible{background:var(--err);}
      .pj-jrn-stale{display:block; margin:0 0 10px;}
      #jrClash .pj-clash{margin:0 0 8px;}

      /* tables, logs */
      .pj-tblwrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--surface);}
      table.pj-tbl{border-collapse:collapse; width:100%; font-size:12.5px;}
      .pj-tbl td{padding:7px 10px; border-top:1px solid var(--border); color:var(--text); vertical-align:top;}
      .pj-tbl tr:first-child td{border-top:none;}
      .pj-tbl a{color:var(--acc);}
      .pj-empty{padding:26px; text-align:center; color:var(--text-muted); font-size:13.5px;}
      .pj-empty a{color:var(--acc);}
      .pj-search{padding:7px 11px; font-size:13px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); width:100%; max-width:420px;}
      .pj-log{background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:9px 12px; margin-bottom:8px;}
      .pj-log.sys{border-style:dashed;}
      .pj-log-date{font-size:10.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase;}
      .pj-log-text{font-size:13px; color:var(--text); margin-top:3px; white-space:pre-wrap; word-break:break-word;}
      .pj-log-user{font-size:10.5px; color:var(--text-muted); margin-top:3px;}
      .pj-more{background:none; border:none; padding:0; color:var(--acc); font-size:12px; cursor:pointer;}
      .pj-client{font-size:14px; color:var(--text); line-height:1.6;}
      .pj-client a{color:var(--acc);}

      /* files */
      .pj-crumb{display:flex; gap:4px; align-items:center; flex-wrap:wrap; font-size:13px; margin-bottom:10px;}
      .pj-crumb a{color:var(--acc); cursor:pointer; text-decoration:none;}
      .pj-sep{color:var(--text-muted);}
      .pj-file{display:flex; align-items:center; gap:10px; padding:9px 12px; border-top:1px solid var(--border); cursor:pointer; color:var(--text); font-size:13.5px;}
      .pj-file:first-child{border-top:none;}
      .pj-file:hover{background:var(--surface-2);}
      .pj-file.local{cursor:default; opacity:.85;}
      .pj-fname{min-width:0; word-break:break-word; display:flex; flex-direction:column;}
      .pj-fdesc{font-size:11.5px; color:var(--text-muted);}
      .pj-file .meta{margin-left:auto; color:var(--text-muted); font-size:11.5px; white-space:nowrap; text-align:right; display:flex; flex-direction:column; align-items:flex-end;}
      .pj-where{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted);}
      .pj-where.cloud{color:var(--acc);}
      .pj-file .pj-dl{flex:0 0 auto; min-width:34px; min-height:30px; padding:4px 9px; border:1px solid var(--border); border-radius:7px;
        background:var(--surface); color:var(--text-muted); font-size:13px; font-weight:700; cursor:pointer;}
      .pj-file .pj-dl:hover{border-color:var(--acc); color:var(--acc);}
      .cap-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; padding:10px 12px;
        border:1px dashed var(--border); border-radius:10px; background:var(--surface);}
      .cap-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-right:4px;}
      .cap-prog{font-size:12px; color:var(--text-muted); min-height:15px;}

      /* modals */
      .pj-overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:70; padding:14px;}
      .pj-overlay.open{display:flex;}
      .pj-modal{background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:14px; width:100%; max-width:540px;
        max-height:90vh; overflow-y:auto; padding:20px; box-shadow:0 8px 32px rgba(0,0,0,.4);}
      .pj-modal h3{margin:0 0 14px; font-size:16px;}
      .pj-modal-actions{display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:14px;}
      .pj-glow{animation:pjglow 1.2s ease-out;}
      @keyframes pjglow{from{box-shadow:0 0 0 3px rgba(214,161,58,.7);} to{box-shadow:none;}}
      @media (max-width:700px){ .pj-switch input{width:150px;} .pj-title{font-size:17px;} }
    </style>
  </head>
  <body>
    <div class="topbar" id="dcr2Topbar"></div>

    <div class="pj">
      <div class="pj-head">
        <div class="pj-thumb" id="pjThumb">…</div>
        <div style="flex:1;min-width:200px">
          <div class="pj-title" id="pjTitle">Loading…</div>
          <div class="pj-sub" id="pjSub"></div>
        </div>
        <span class="pj-status" id="pjStatus"></span>
        <div class="pj-here" id="pjHere" hidden aria-label="Who else has this project open"></div>
        <div class="pj-switch">
          <input id="pjJump" list="pjJumpList" placeholder="Jump to project…" autocomplete="off" aria-label="Jump to another project" />
          <datalist id="pjJumpList"></datalist>
        </div>
        <a class="pj-btn" id="pjOldPortal" href="#" target="_blank" rel="noopener" hidden
          title="This project came from the old portal: its old estimates, money and documents are there">Old portal ↗</a>
        <button class="pj-btn" id="pjSave" type="button" title="This page saves by itself — use this only to save right now">💾 Save now</button>
      </div>
      <div style="display:flex;gap:12px;align-items:center;min-height:18px;margin-bottom:6px">
        <span class="dcr-live" id="pjMsg"></span>
        <span class="pj-msg" id="pjNotice" role="status"></span>
      </div>
      <div class="pj-editing" id="pjEditing" hidden role="status"></div>

      <div class="pj-tabs" id="pjTabs" role="tablist">
        <button class="pj-tab active" data-tab="overview" type="button" role="tab">Overview</button>
        <button class="pj-tab" data-tab="log" type="button" role="tab">Log</button>
        <button class="pj-tab" data-tab="journal" type="button" role="tab">Journal</button>
        <button class="pj-tab" data-tab="mailing" type="button" role="tab">Mailing</button>
        <button class="pj-tab" data-tab="files" type="button" role="tab">Files</button>
      </div>

      <div class="pj-pane active" id="pane-overview" role="tabpanel"><div class="pj-empty">Loading…</div></div>
      <div class="pj-pane" id="pane-log" role="tabpanel"><div class="pj-empty">Loading…</div></div>
      <div class="pj-pane" id="pane-journal" role="tabpanel"><div class="pj-empty">Loading…</div></div>
      <div class="pj-pane" id="pane-mailing" role="tabpanel"><div class="pj-empty">Loading…</div></div>
      <div class="pj-pane" id="pane-files" role="tabpanel"><div class="pj-empty">Loading…</div></div>
    </div>

    <!-- voice note: record, live transcript where available, review, save to Site Notes -->
    <div class="pj-overlay" id="recModal" role="dialog" aria-modal="true" aria-labelledby="recH">
      <div class="pj-modal" style="max-width:460px">
        <h3 id="recH">🎙 Voice note</h3>
        <div style="text-align:center;margin:6px 0 12px">
          <div id="recTimer" style="font-size:30px;font-weight:700;color:var(--text)">0:00</div>
          <div class="pj-sub" id="recState">Ready to record</div>
        </div>
        <textarea id="recTranscript" class="pj-ta" rows="5" readonly placeholder="The transcript appears here while you talk."></textarea>
        <div class="pj-sub" id="recHint" style="margin-top:5px"></div>
        <label class="pj-check"><input type="checkbox" id="recSaveTx" checked> Save the transcript as a text file too</label>
        <div class="pj-msg err" id="recMsg" role="alert"></div>
        <div class="pj-modal-actions">
          <button class="pj-btn" id="recCancel" type="button">Cancel</button>
          <button class="pj-btn pj-btn-primary" id="recBtn" type="button">● Start recording</button>
        </div>
      </div>
    </div>

    <!-- text note: saved as a .txt into Documents / Site Notes -->
    <div class="pj-overlay" id="noteModal" role="dialog" aria-modal="true" aria-labelledby="noteH">
      <div class="pj-modal">
        <h3 id="noteH">📝 Site note</h3>
        <div class="pj-f"><label for="noteTitle">Title (optional)</label><input id="noteTitle" /></div>
        <div class="pj-f" style="margin-top:8px"><label for="noteBody">Note</label><textarea id="noteBody" rows="7"></textarea></div>
        <div class="pj-msg err" id="noteMsg" role="alert"></div>
        <div class="pj-modal-actions">
          <button class="pj-btn" id="noteCancel" type="button">Cancel</button>
          <button class="pj-btn pj-btn-primary" id="noteSave" type="button">⬆ Save to Site Notes</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/pages/project.js"></script>
  </body>
</html>
