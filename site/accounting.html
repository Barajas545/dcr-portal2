<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://nmjoenqkjyhngjvdealh.supabase.co https://*.tile.openstreetmap.org; media-src 'self' blob: https://nmjoenqkjyhngjvdealh.supabase.co; connect-src 'self' https://nmjoenqkjyhngjvdealh.supabase.co wss://nmjoenqkjyhngjvdealh.supabase.co https://nominatim.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DCR Portal 2 — The Books</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="theme-color" content="#0f8b7d" />
    <meta name="apple-mobile-web-app-title" content="Portal 2" />
    <script src="js/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <style>
      /* the old accounting.html's look, on Portal 2's theme tokens (light and dark) */
      *, *::before, *::after { box-sizing: border-box; }
      [hidden] { display: none !important; }
      .ac { max-width: 1180px; margin: auto; padding: 18px 16px 50px;
        --acc:#2f80d8; --gold:#a8790a; --ok:#1f8a5f; --err:#c8371f; --acc-tint:rgba(47,128,216,.08); }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ac { --acc:#6aa9ec; --gold:#e0b049; --ok:#4cc28f; --err:#f0937f; --acc-tint:rgba(47,128,216,.16); } }
      :root[data-theme="dark"] .ac { --acc:#6aa9ec; --gold:#e0b049; --ok:#4cc28f; --err:#f0937f; --acc-tint:rgba(47,128,216,.16); }

      .ac-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      .ac-head h2 { margin: 0; font-size: 22px; font-weight: 700; color: var(--text); }
      .ac-head .who { color: var(--text-muted); font-size: 13.5px; }
      .ac-head .grow { flex: 1; }
      .ac-lead { color: var(--text-muted); font-size: 13.5px; margin: 4px 0 16px; line-height: 1.5; }

      .ac-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
      .ac-tabs a { padding: 9px 16px; font-size: 13.5px; font-weight: 600; text-decoration: none;
        color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
      .ac-tabs a:hover { color: var(--text); }
      .ac-tabs a[aria-current="page"] { color: var(--acc); border-bottom-color: var(--acc); }

      .ac-view { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .ac-view button { padding: 6px 13px; font: inherit; font-size: 12px; font-weight: 700;
        border: 0; background: var(--surface); color: var(--text-muted); cursor: pointer; }
      .ac-view button + button { border-left: 1px solid var(--border); }
      .ac-view button[aria-pressed="true"] { background: var(--acc); color: #fff; }

      .ac-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
      @media (max-width: 820px) { .ac-cards { grid-template-columns: repeat(2, 1fr); } }
      .ac-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; min-width: 0; }
      .ac-card .k { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
      .ac-card .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--text); overflow-wrap: anywhere; }
      .ac-card .n { font-size: 11px; color: var(--text-muted); }
      .ac-card.go { border-color: var(--ok); } .ac-card.go .v { color: var(--ok); }
      .ac-card.late { border-color: var(--err); border-width: 2px; } .ac-card.late .v, .ac-card.late .n { color: var(--err); }
      .ac-card.wait { border-color: var(--gold); } .ac-card.wait .v { color: var(--gold); }

      .ac-sec { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
        padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); scroll-margin-top: 70px; min-width: 0; }
      .ac-sec > header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
      .ac-sec h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--text); }
      .ac-sec .hint { font-size: 12.5px; color: var(--text-muted); }
      .ac-sec .grow { flex: 1; }

      table.ac-t { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: auto; }
      .ac-t th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted);
        padding: 4px 6px; border-bottom: 1px solid var(--border); font-weight: 700; }
      /* styles.css keeps every th / td on one clipped line (max 320 px): these wrap */
      .ac-t th, .ac-t td { white-space: normal; max-width: none; overflow: visible; text-overflow: clip; }
      .ac-t td { padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text); overflow-wrap: anywhere; }
      .ac-t tr:last-child td { border-bottom: 0; }
      .ac-t .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
      .ac-t .who { font-weight: 700; }
      .ac-t .meta { color: var(--text-muted); font-size: 11.5px; }
      .ac-t .late { color: var(--err); font-weight: 700; font-size: 11.5px; }
      .ac-t a { color: var(--acc); text-decoration: none; white-space: nowrap; }
      .ac-t a:hover { text-decoration: underline; }
      .ac-t input[type=checkbox] { width: 18px; height: 18px; }
      .ac-t .reason { color: var(--gold); font-size: 11.5px; font-weight: 600; }
      .ac-t .kind { font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; border: 1px solid var(--border);
        border-radius: 4px; padding: 0 5px; color: var(--text-muted); margin-left: 4px; white-space: nowrap; }

      .ac-b { padding: 8px 13px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
        border: 1px solid var(--border); background: var(--surface); color: var(--text); text-decoration: none; display: inline-block; }
      .ac-b:hover { border-color: var(--acc); color: var(--acc); }
      .ac-b.go { background: var(--ok); border-color: var(--ok); color: #fff; }
      .ac-b.go:disabled, .ac-b:disabled { opacity: .5; cursor: default; }
      .ac-b.go:hover:not(:disabled) { color: #fff; }
      .ac-ref { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
        font-size: 13px; font-family: inherit; width: 190px; max-width: 100%; }
      .ac-msg { font-size: 12.5px; margin-top: 8px; white-space: pre-line; color: var(--text); }
      .ac-msg.err { color: var(--err); font-weight: 600; }
      .ac-none { color: var(--text-muted); font-size: 13px; padding: 14px 4px; }
      .ac-note { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }
      .ac-note b { color: var(--gold); }
      .ac-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

      /* refused[] of a mark: said in full, never a silent partial */
      .ac-refused { border: 1px solid var(--gold); border-radius: 9px; background: rgba(184,134,11,.08); padding: 10px 12px; margin-top: 10px;
        font-size: 12.5px; color: var(--text); }
      .ac-refused b { color: var(--gold); }
      .ac-refused ul { margin: 6px 0 0; padding-left: 18px; }

      /* ── writing checks ── */
      .ck-row { cursor: pointer; }
      .ck-row:hover { background: rgba(127,127,127,.06); }
      .ck-payee { font-size: 15px; font-weight: 700; color: var(--text); overflow-wrap: anywhere; }
      .ck-for { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; overflow-wrap: anywhere; }
      .ck-part { display: inline-block; font-size: 11px; font-weight: 700; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; padding: 1px 5px; margin-left: 6px; white-space: nowrap; }
      .ck-panel { background: rgba(127,127,127,.05); border-radius: 10px; padding: 16px; margin: 4px 0 10px; cursor: default; }
      .ck-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 14px; margin-bottom: 14px; }
      .ck-f label, .ck-f .lab { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
        color: var(--text-muted); margin-bottom: 4px; }
      .ck-f input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface);
        color: var(--text); font: inherit; font-size: 14px; }
      .ck-f input.big { font-size: 18px; font-weight: 700; }
      .ck-f .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
      .ck-f .sub.warn { color: var(--gold); font-weight: 600; }
      .ck-docs { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }
      .ck-docs h4 { margin: 0 0 8px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
      .ck-doc { display: flex; align-items: baseline; gap: 8px; font-size: 13px; padding: 3px 0; flex-wrap: wrap; color: var(--text); }
      .ck-doc .nm { font-weight: 600; overflow-wrap: anywhere; }
      .ck-doc .tag { font-size: 10.5px; color: var(--text-muted); }
      .ck-doc button.lnk { border: 0; background: none; color: var(--acc); font: inherit; font-weight: 600; cursor: pointer; padding: 0; text-align: left; }
      .ck-commit { font-size: 13px; padding: 8px 10px; border-radius: 7px; background: var(--acc-tint); border: 1px solid rgba(47,128,216,.3); margin: 8px 0; color: var(--text); }
      .ck-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
      .ck-tell { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; background: var(--surface); }
      .ck-tell .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
      .ck-how { font-size: 12.5px; margin: 8px 0; color: var(--text); }
      .ck-how.certain { color: var(--ok); }
      .ck-how.guess { color: var(--gold); font-weight: 600; }
      .ck-how.none { color: var(--err); font-weight: 600; }
      .ck-msg-box { font-size: 12.5px; white-space: pre-line; background: rgba(127,127,127,.06); border-radius: 8px; padding: 10px 12px; margin: 8px 0;
        max-height: 190px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.5; color: var(--text); overflow-wrap: anywhere; }
      .ck-none-note { font-size: 12.5px; color: var(--text-muted); }
      .ck-method { font-size: 10.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px;
        border: 1px solid var(--ok); color: var(--ok); margin-left: 6px; white-space: nowrap; }
      .ck-method.cash { border-color: var(--gold); color: var(--gold); }
      .ck-method.none { border-color: var(--text-muted); color: var(--text-muted); }
      .ck-method.either { border-color: var(--acc); color: var(--acc); }
      .ck-methods { display: flex; gap: 8px; flex-wrap: wrap; }
      .ck-mbtn { padding: 9px 16px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
        border: 1px solid var(--border); background: var(--bg); color: var(--text); }
      .ck-mbtn[aria-pressed="true"] { border-color: var(--acc); background: var(--acc-tint); color: var(--acc); }
      .ck-viewer { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); min-height: 120px; max-height: 460px;
        display: flex; align-items: center; justify-content: center; overflow: auto; color: var(--text-muted); font-size: 12.5px; margin-top: 8px; padding: 8px; }
      .ck-viewer img { max-width: 100%; max-height: 440px; display: block; }
      .btn-accept { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--ok); background: var(--ok); color: #fff; font: inherit;
        font-size: 13.5px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
      .btn-accept:disabled { opacity: .5; cursor: default; }

      /* ── what needs doing ── */
      .ac-todo { border-color: var(--acc); }
      .ac-todo-list { list-style: none; margin: 0; padding: 0; }
      .ac-todo-list li { display: flex; align-items: baseline; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text); }
      .ac-todo-list li:last-child { border-bottom: 0; }
      .ac-todo-list .ic { width: 18px; text-align: center; font-size: 13px; color: var(--acc); flex: none; }
      .ac-todo-list .tx { flex: 1; font-weight: 600; min-width: 0; }
      .ac-todo-list .tx a { color: inherit; text-decoration: none; }
      .ac-todo-list .tx a:hover { text-decoration: underline; }
      .ac-todo-list .am { font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
      .ac-todo-list li.waiting .ic, .ac-todo-list li.waiting .tx { color: var(--gold); }
      .ac-todo-list li.tell .ic { color: var(--ok); }
      .ac-glance { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-muted); }
      .ac-glance b { color: var(--text); }
      .ac-glance .warn { color: var(--gold); font-weight: 600; }
      .ac-glance a { color: var(--acc); text-decoration: none; font-weight: 600; }

      /* ── the picture: money leaving the door, and keying into QuickBooks (two tracks, not one queue) ── */
      .bk { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px 16px 13px; margin-bottom: 18px; box-shadow: var(--shadow); }
      .bk-band + .bk-band { margin-top: 15px; border-top: 1px solid var(--border); padding-top: 14px; }
      .bk-bh { display: flex; align-items: baseline; gap: 10px; margin-bottom: 11px; flex-wrap: wrap; }
      .bk-bh h4 { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
      .bk-bh .cap { font-size: 12.5px; color: var(--text-muted); }
      .bk-bh .tot { margin-left: auto; font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
      .bk-flow { display: flex; align-items: stretch; flex-wrap: wrap; gap: 2px; }
      .bk-arrow { align-self: center; color: var(--text-muted); font-size: 15px; padding: 0 3px; flex: 0 0 auto; opacity: .55; }
      @media (max-width: 700px) { .bk-flow { flex-direction: column; } .bk-arrow { display: inline-block; transform: rotate(90deg); padding: 3px 0; } }
      .bk-st { flex: 1 1 150px; min-width: 150px; position: relative; text-align: left; border: 1px solid var(--border); border-radius: 10px;
        padding: 11px 12px 10px; background: var(--bg); color: var(--text); font: inherit; cursor: pointer; transition: border-color .12s, transform .12s; }
      .bk-st:hover:not(.idle) { border-color: var(--acc); transform: translateY(-1px); }
      .bk-st > span { display: block; }
      .bk-st .k { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); line-height: 1.35; min-height: 2.7em; }
      .bk-st .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; letter-spacing: -.01em; }
      .bk-st .n { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
      .bk-st .bar { height: 4px; border-radius: 3px; background: rgba(127,127,127,.18); margin-top: 8px; overflow: hidden; }
      .bk-st .bar i { display: block; height: 100%; background: var(--text-muted); border-radius: 3px; }
      .bk-st .flag { display: block; font-size: 11px; font-weight: 700; color: var(--err); margin-top: 5px; }
      .bk-st.mine { border-color: var(--acc); background: var(--acc-tint); }
      .bk-st.mine .v { color: var(--acc); }
      .bk-st.mine .bar i { background: var(--acc); }
      .bk-st.theirs { border-color: var(--gold); background: rgba(184,134,11,.07); }
      .bk-st.theirs .v { color: var(--gold); }
      .bk-st.theirs .bar i { background: var(--gold); }
      .bk-st.idle { opacity: .45; cursor: default; }
      .bk-st.done .v { color: var(--ok); }
      .bk-step { position: absolute; top: -9px; left: 10px; background: var(--acc); color: #fff; font-size: 9.5px; font-weight: 800; letter-spacing: .04em;
        text-transform: uppercase; border-radius: 9px; padding: 2px 8px; white-space: nowrap; }
      .bk-st.theirs .bk-step { background: var(--gold); }
      .bk-who { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--text-muted); margin-top: 6px; }
      .bk-st.mine .bk-who { color: var(--acc); }
      .bk-st.theirs .bk-who { color: var(--gold); }
      .bk-st .bk-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .bk-chip { font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--text-muted); }
      .bk-chip.check { border-color: var(--ok); color: var(--ok); }
      .bk-chip.cash { border-color: var(--gold); color: var(--gold); }
      .bk-chip.either { border-color: var(--acc); color: var(--acc); }
      .bk-age { margin-top: 12px; }
      .bk-age .ln { font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; }
      .bk-age .ln b { color: var(--text); }
      .bk-age .ln b.late { color: var(--err); }
      .bk-agebar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: rgba(127,127,127,.18); }
      .bk-agebar span { display: block; height: 100%; }
      .bk-agebar .late { background: var(--err); }
      .bk-agebar .soon { background: var(--gold); }
      .bk-agebar .later { background: var(--acc); opacity: .75; }
      .bk-agebar .undated { background: var(--text-muted); opacity: .5; }
      .bk-legend { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 7px; font-size: 11.5px; color: var(--text-muted); }
      .bk-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
      .bk-legend i.late { background: var(--err); } .bk-legend i.soon { background: var(--gold); }
      .bk-legend i.later { background: var(--acc); } .bk-legend i.undated { background: var(--text-muted); }
      .bk-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
      .bk-foot b { color: var(--text); }
      .bk-quiet { font-size: 13px; color: var(--text-muted); padding: 4px 2px 2px; }
      @keyframes bkflash { from { box-shadow: 0 0 0 3px var(--acc); } to { box-shadow: var(--shadow); } }
      .ac-flash { animation: bkflash 1.1s ease-out 1; }
      @media (max-width: 560px) {
        table.ac-t { table-layout: fixed; }
        .ac-t th.num { width: 92px; }
        .ac-t th.c-pick { width: 30px; }
        .ac-t th.c-go { width: 58px; }
        .ac-t th.c-undo { width: 44px; }
        .ac-t th.c-st { width: 66px; }
        .ac-t td, .ac-t th { padding-left: 4px; padding-right: 4px; }
        .ac-t .hide-sm { display: none; }
        .ac-ref { width: 100%; }
        .ac-sec { padding: 14px 12px; }
      }
      @media print { .ac-view, .ac-tabs, .topbar, .ac-b, .btn-accept { display: none !important; } }
    </style>
  </head>
  <body>
    <div class="topbar" id="dcr2Topbar"></div>
    <main class="ac" id="acRoot">
      <nav class="ac-tabs" aria-label="The office's money pages">
        <a href="accounting.html" aria-current="page">The Books</a>
        <a href="ledger.html">Expenses &amp; receipts</a>
      </nav>
      <div class="ac-head">
        <h2>The books</h2>
        <span class="who" id="acGreeting"></span>
        <span class="grow"></span>
        <div class="ac-view" id="acView" role="group" aria-label="How to show the summary">
          <button type="button" data-view="picture" aria-pressed="true">Picture</button>
          <button type="button" data-view="cards" aria-pressed="false">Numbers</button>
        </div>
      </div>
      <p class="ac-lead">
        What is ready to enter in QuickBooks, what is already in, and what is stuck and on whom. Nothing here talks to
        Intuit — you carry the data across (a CSV or by hand), and Portal 2 remembers what you have marked entered so
        nothing is entered twice.
      </p>
      <div class="ac-cards" id="acCards"></div>
      <div id="acBody"><div class="ac-none">Loading…</div></div>
    </main>
    <script type="module" src="js/pages/accounting.js"></script>
  </body>
</html>
