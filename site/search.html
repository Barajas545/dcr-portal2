<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://nmjoenqkjyhngjvdealh.supabase.co https://*.tile.openstreetmap.org; media-src 'self' blob: https://nmjoenqkjyhngjvdealh.supabase.co; connect-src 'self' https://nmjoenqkjyhngjvdealh.supabase.co wss://nmjoenqkjyhngjvdealh.supabase.co https://nominatim.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DCR Portal 2 — Search</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="theme-color" content="#0f8b7d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portal 2" />
    <script src="js/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <style>
      .se{--acc:#2f80d8; --tint:rgba(47,128,216,0.12); max-width:760px; margin:0 auto; padding:20px 16px 60px;}
      .se-box{position:relative; margin-bottom:18px;}
      .se-input{width:100%; box-sizing:border-box; padding:14px 18px; font-size:16px;
        border:2px solid var(--border); border-radius:14px; background:var(--surface); color:var(--text);}
      .se-input:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 4px var(--tint);}
      .se-note{font-size:12.5px; color:var(--text-muted); margin:-8px 0 16px; min-height:16px;}
      .se-grp{margin-bottom:18px;}
      .se-grp h3{margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); display:flex; align-items:center; gap:8px;}
      .se-count{background:var(--surface-2); border-radius:11px; padding:1px 8px; font-size:11px; font-weight:700;}
      .se-item{display:block; background:var(--surface); border:1px solid var(--border); border-radius:10px;
        padding:11px 14px; margin-bottom:7px; text-decoration:none; transition:border-color .1s;}
      a.se-item:hover, a.se-item:focus-visible{border-color:var(--acc); outline:none;}
      .se-title{font-size:14.5px; font-weight:600; color:var(--text);}
      .se-sub{font-size:12px; color:var(--text-muted); margin-top:2px;}
      .se-sub a{color:var(--acc); text-decoration:none;}
      .se-item.thumbed{display:flex; align-items:center; gap:12px;}
      .se-thumb{width:64px; height:48px; flex-shrink:0; border-radius:8px; overflow:hidden; background:var(--surface-2);
        display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--text-muted);}
      .se-thumb img{width:100%; height:100%; object-fit:cover;}
      .se-item.thumbed .se-txt{min-width:0; flex:1;}
      /* a project and, beside it (never inside its link), the 📐 plan button once the takeoff folder answers */
      .se-proj{display:flex; gap:7px; align-items:stretch; margin-bottom:7px;}
      .se-proj > .se-item{flex:1; min-width:0; margin-bottom:0;}
      .se-proj .se-txt{overflow-wrap:anywhere;}
      .se-plan{display:flex; flex-shrink:0;}
      .se-plan[hidden]{display:none;}
      .se-plan-go{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; width:56px; min-height:44px;
        box-sizing:border-box; background:var(--surface); border:1px solid var(--border); border-radius:10px; text-decoration:none;
        color:var(--text); transition:border-color .1s;}
      .se-plan-go:hover, .se-plan-go:focus-visible{border-color:var(--acc); outline:none;}
      .se-plan-go .ic{font-size:20px; line-height:1;}
      .se-plan-go .tx{font-size:10.5px; font-weight:700; color:var(--text-muted); letter-spacing:.02em;}
      @media (max-width:520px){ .se-thumb{width:52px; height:40px;} .se-plan-go{width:50px;} }
      .se-more{font-size:12px; color:var(--text-muted); font-style:italic; padding:2px 4px;}
      .se-empty{padding:36px; text-align:center; color:var(--text-muted); font-size:14px;}
    </style>
  </head>
  <body>
    <div class="topbar" id="dcr2Topbar"></div>

    <div class="se">
      <div class="se-box">
        <input id="seInput" class="se-input" type="search" placeholder="Search projects, contacts, estimate items, tasks, files…" autocomplete="off" aria-label="Search" />
      </div>
      <div class="se-note" id="seNote" role="status"></div>
      <div id="seResults"><div class="se-empty">Type at least 2 characters to search.</div></div>
    </div>

    <script type="module" src="js/pages/search.js"></script>
  </body>
</html>
