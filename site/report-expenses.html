<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://nmjoenqkjyhngjvdealh.supabase.co https://*.tile.openstreetmap.org; media-src 'self' blob: https://nmjoenqkjyhngjvdealh.supabase.co; connect-src 'self' https://nmjoenqkjyhngjvdealh.supabase.co wss://nmjoenqkjyhngjvdealh.supabase.co https://nominatim.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DCR Portal 2 — Expense Report</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <script src="js/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <style>
      .rp-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; background:var(--surface);
        border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;}
      .rp-btn{padding:8px 14px; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer; font-family:inherit;
        border:1px solid var(--border); background:var(--surface); color:var(--text); text-decoration:none;}
      .rp-btn:hover{background:var(--surface-2);}
      .rp-btn-primary{background:#2f80d8; border-color:#2f80d8; color:#fff;}
      .rp-badge{font-size:10.5px; font-weight:800; letter-spacing:.04em; padding:2px 8px; border-radius:9px; background:#0f766e; color:#fff;}
      .rp-loading{text-align:center; color:#5a6b7d; padding:60px 0;}
      /* paper-white, always light: this page exists to be printed */
      .sheet{max-width:8.5in; margin:18px auto; background:#fff; color:#111; padding:.6in .7in; box-shadow:0 3px 20px rgba(0,0,0,.25);
        font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.4; box-sizing:border-box;}
      .sheet *{box-sizing:border-box;}
      .lh{display:flex; align-items:center; justify-content:space-between; gap:14px; border-bottom:3px solid #111; padding-bottom:12px; margin-bottom:14px;}
      .lh img{height:44px; width:auto;}
      .lh .co{font-size:9.5px; color:#333; line-height:1.5; text-align:center;}
      .lh h1{margin:0; font-size:20px; letter-spacing:.1em; color:#111;}
      .who{display:flex; justify-content:space-between; gap:12px; margin-bottom:14px; font-size:12.5px; flex-wrap:wrap;}
      /* what this sheet covers, when it was printed from a filtered view */
      .filt{margin:-4px 0 12px; padding:5px 9px; background:#f4f6f8; border-left:3px solid #111; font-size:11px; color:#333; line-height:1.45;}
      .tblwrap{max-width:100%;}
      table.ex{width:100%; border-collapse:collapse;}
      /* styles.css clips every cell to one line and paints th dark in a dark theme: undone inside the white sheet */
      .ex th,.ex td{white-space:normal; max-width:none; overflow:visible; text-overflow:clip; overflow-wrap:break-word; background:none; position:static; color:#111;}
      .ex td.dt{width:80px; white-space:nowrap;}
      .ex thead{display:table-header-group;}
      .ex th{border-bottom:2px solid #111; padding:5px 6px; text-align:left; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;}
      .ex th.amt,.ex td.amt{text-align:right; white-space:nowrap; width:78px;}
      .ex td{padding:5px 6px; border-bottom:1px solid #ddd; vertical-align:top;}
      .ex td .vd{display:block; font-size:10px; color:#555;}
      .ex .oth{color:#666;}
      .ex tr.grp td{background:#f0f0f0; font-weight:700; border-bottom:1px solid #999; padding-top:8px;}
      .ex tr.sub td{font-weight:700; border-bottom:2px solid #999; background:#fafafa;}
      .ex tr.grand td{font-weight:700; font-size:12.5px; border-top:3px double #111; border-bottom:none; padding-top:9px;}
      .group-block{break-inside:avoid;}
      .note{margin-top:10px; font-size:10px; color:#555; line-height:1.5;}
      .foot{margin-top:22px; font-size:10px; color:#777; text-align:center;}
      @media screen and (max-width:900px){ .sheet{padding:.3in; margin:8px;} }
      /* a phone: the table scrolls inside its sheet, the page itself never scrolls sideways */
      @media screen and (max-width:700px){
        .sheet{padding:14px 12px; margin:8px;}
        .lh{flex-wrap:wrap;}
        .tblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
        .tblwrap table{min-width:720px;}
      }
      @media print{
        .rp-controls, .topbar{display:none !important;}
        body{background:#fff !important;}
        .sheet{box-shadow:none; margin:0; max-width:none; padding:0;}
        @page{margin:.6in .65in;}
      }
    </style>
  </head>
  <body>
    <div class="rp-controls">
      <a class="rp-btn" id="rpBack" href="board.html">← Back</a>
      <span class="rp-badge">Portal 2</span>
      <button class="rp-btn rp-btn-primary" id="rpPrint" type="button" style="margin-left:auto">🖨 Print / Save as PDF</button>
    </div>
    <div id="rpSheet" class="sheet"><div class="rp-loading">Loading expense report…</div></div>
    <script type="module" src="js/pages/report-expenses.js"></script>
  </body>
</html>
