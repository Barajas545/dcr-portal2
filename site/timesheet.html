<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://nmjoenqkjyhngjvdealh.supabase.co https://*.tile.openstreetmap.org; media-src 'self' blob: https://nmjoenqkjyhngjvdealh.supabase.co; connect-src 'self' https://nmjoenqkjyhngjvdealh.supabase.co wss://nmjoenqkjyhngjvdealh.supabase.co https://nominatim.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DCR Portal 2 — Time Sheet</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="theme-color" content="#0f8b7d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portal 2" />
    <script src="js/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <style>
      /* The old Time Sheet's look: the portal's variables (light + dark) and the timesheets' blue. */
      .ts-app { max-width: 1000px; margin: auto; padding: 20px 16px 60px; }
      .ts-section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow); }
      .ts-head { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
      .ts-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
      .ts-head a.btn { text-decoration: none; }
      .ts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .ts-full { grid-column: 1 / -1; }
      .ts-label { font-size: 13px; color: var(--text-muted); margin: 0 0 4px; font-weight: 600; display: block; }
      .ts-input { width: 100%; font-family: inherit; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; box-sizing: border-box; background: var(--surface); color: var(--text); color-scheme: light dark; }
      .ts-input:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--tint-2); }
      .ts-input:disabled { background: var(--surface-2); color: var(--text-muted); }
      .ts-week-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; display: flex; justify-content: space-between; }
      .ts-week-label .tot { color: var(--text); text-transform: none; letter-spacing: 0; font-size: 13px; }
      .cal-cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 5fr); align-items: start; }
      .cal-wkend { padding-right: 12px; }
      .cal-work { border-left: 2px solid var(--acc); padding-left: 12px; }
      .cal-g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 8px; row-gap: 4px; }
      .cal-g5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: 8px; row-gap: 4px; }
      .cal-ww { font-size: 10px; font-weight: 700; color: var(--acc); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
      .cal-day-name { text-align: center; font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
      .cal-day-name.wd { color: var(--acc); }
      .cal-day { border: 1px solid var(--border); border-radius: 8px; padding: 8px; min-height: 110px; background: var(--surface-2); color: var(--text); cursor: pointer; transition: border-color .15s, background .15s; text-align: left; font: inherit; width: 100%; box-sizing: border-box; display: block; }
      .cal-day:hover { border-color: var(--text-muted); background: var(--surface); }
      .cal-day.has-entry { background: var(--tint); border-color: var(--acc); }
      .cal-day.today { border-color: var(--acc); border-width: 2px; }
      .cal-day.selected { border-color: var(--acc); box-shadow: 0 0 0 2px var(--tint-2); }
      .cal-day-header { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
      .cal-day-num { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
      .cal-day.weekend:not(.has-entry) .cal-day-num { color: var(--text-muted); }
      .cal-day.today .cal-day-num { color: var(--acc); }
      .cal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin-bottom: 5px; font-size: 11px; }
      .cal-card:hover { border-color: var(--acc); }
      .cal-card.leave { border-left: 3px solid var(--gold); }
      .cal-card-project { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cal-card-who { color: var(--acc); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cal-card-work { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      .cal-card-hrs { margin-top: 3px; }
      .hrs-badge { display: inline-block; background: var(--tint-2); color: var(--badge-text); border-radius: 4px; padding: 1px 5px; font-size: 10px; font-weight: 700; }
      .cal-add-btn { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
      .cal-day:hover .cal-add-btn { color: var(--acc); }
      .card-actions { display: flex; gap: 4px; margin-top: 5px; border-top: 1px solid var(--border); padding-top: 4px; flex-wrap: wrap; }
      .card-action { background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 10px; color: var(--text-muted); font-weight: 600; }
      .card-action:hover { background: var(--tint); color: var(--acc); }
      .card-action.del:hover { color: var(--err); background: rgba(200,55,31,.16); }
      /* a day is about 100 px wide: the actions are icons (named by title and aria-label) on one line */
      .card-action .lbl { display: none; }
      .card-actions { flex-wrap: nowrap; justify-content: space-between; }
      .card-action { font-size: 12px; padding: 2px 5px; }
      /* a narrower day (a tablet held upright: 700 to 900 px wide, still this page): less padding,
         and the icons wrap inside the card rather than stick out past its edge */
      @media (max-width: 900px) {
        .card-actions { flex-wrap: wrap; justify-content: flex-start; gap: 0 2px; }
        .card-action { padding: 2px 3px; }
      }
      .week-sep { margin: 1rem 0; border-top: 1px solid var(--border); }
      .btn-primary { background: var(--acc); color: #fff; border: none; padding: 10px 20px; border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: 600; }
      .btn-primary:hover { background: var(--acc-2); }
      .btn-primary:disabled { background: #7a8595; cursor: not-allowed; }
      .btn-secondary { background: var(--surface); border: 1px solid var(--border); padding: 9px 18px; border-radius: 7px; cursor: pointer; font-size: 14px; color: var(--text); }
      .btn-secondary:hover { background: var(--surface-2); }
      .btn-danger { background: rgba(200,55,31,.15); color: var(--err); border: none; padding: 9px 18px; border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: 600; }
      .msg-success { color: var(--ok); background: rgba(15,110,86,.16); border-radius: 6px; padding: 10px 14px; font-size: 14px; display: inline-block; }
      .msg-error { color: var(--err); background: rgba(200,55,31,.16); border-radius: 6px; padding: 10px 14px; font-size: 14px; display: inline-block; }
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
      .modal-box { background: var(--surface); color: var(--text); border-radius: 12px; border: 1px solid var(--border); padding: 1.5rem; width: 500px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,.35);
        --acc: #2f80d8; --acc-2: #1f6fc8; --tint-2: rgba(47,128,216,.2); --err: #d9614f; --badge-text: #1f6fc8; }
      .modal-box h3 { margin: 0; font-size: 17px; }
      .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.5rem; flex-wrap: wrap; }
      .modal-table { width: 100%; border-collapse: collapse; }
      .modal-table td { padding: 7px 0; font-size: 14px; vertical-align: top; border-bottom: 1px solid var(--border); white-space: normal; max-width: none; overflow: visible; }
      .modal-table td:first-child { color: var(--text-muted); width: 36%; padding-right: 12px; }
      .modal-table td:last-child { font-weight: 600; white-space: pre-wrap; word-break: break-word; }
      .emp-combo { position: relative; }
      .emp-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px; max-height: 220px; overflow-y: auto; z-index: 100; box-shadow: 0 4px 12px rgba(0,0,0,.25); display: none; }
      .emp-dropdown.open { display: block; }
      .emp-option { padding: 9px 12px; font-size: 14px; cursor: pointer; color: var(--text); display: flex; justify-content: space-between; gap: 8px; }
      .emp-option:hover, .emp-option.highlighted { background: var(--tint); }
      .emp-option .no { color: var(--text-muted); font-size: 12px; }
      .emp-no-match { padding: 9px 12px; font-size: 13px; color: var(--text-muted); font-style: italic; }
      .ts-note { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
      .ts-note.warn { color: var(--err); }
      .hrs-control { display: flex; align-items: center; }
      .hrs-btn { width: 48px; height: 42px; border: 1px solid var(--border); background: var(--surface-2); font-size: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); user-select: none; }
      .hrs-btn:hover { background: var(--tint); border-color: var(--acc); color: var(--acc); }
      .hrs-btn-minus { border-radius: 6px 0 0 6px; border-right: none; }
      .hrs-btn-plus { border-radius: 0 6px 6px 0; border-left: none; }
      .hrs-input { flex: 1; height: 42px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; font-weight: 700; text-align: center; color: var(--text); min-width: 60px; outline: none; box-sizing: border-box; padding: 0 8px; border-radius: 0; }
      .hrs-input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--tint-2); }
      .ts-schedule { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-top: 4px; }
      .ts-schedule-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }
      .ts-schedule-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
      .ts-schedule-session { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
      .ts-schedule-session-title { font-size: 11px; font-weight: 700; color: var(--acc); text-transform: uppercase; margin-bottom: 8px; }
      .ts-schedule-session-title.lunch { color: var(--gold); }
      .ts-time-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
      .ts-time-label { font-size: 11px; color: var(--text-muted); font-weight: 600; min-width: 36px; }
      .ts-time-input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 13px; width: 116px; box-sizing: border-box; background: var(--surface); color: var(--text); color-scheme: light dark; }
      .ts-lunch-input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 13px; width: 70px; text-align: center; box-sizing: border-box; background: var(--surface); color: var(--text); }
      .ts-calc-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 8px 12px; border-radius: 6px; font-size: 13px; gap: 8px; flex-wrap: wrap; }
      .ts-calc-match { background: rgba(15,110,86,.16); color: var(--ok); }
      .ts-calc-mismatch { background: rgba(139,105,20,.2); color: var(--gold); }
      .ts-calc-value { font-size: 15px; font-weight: 700; }
      .ts-calc-label { font-weight: 600; }
      .ts-timeline { display: flex; align-items: center; margin-top: 10px; height: 28px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
      .ts-timeline-block { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; min-width: 20px; }
      .ts-timeline-work { background: var(--acc); }
      .ts-timeline-lunch { background: #e0a33a; }
      .ts-timeline-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin-top: 3px; }
      .ts-ro { border: 1px dashed var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text-muted); font-size: 13.5px; }
      @media (max-width: 760px) {
        .ts-grid { grid-template-columns: 1fr; }
        .ts-schedule-grid { grid-template-columns: 1fr; }
        .cal-cols { grid-template-columns: 1fr; }
        .cal-wkend { padding: 0 0 10px; }
        .cal-work { border-left: 0; padding-left: 0; border-top: 2px solid var(--acc); padding-top: 8px; }
        .cal-g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .cal-ww, .cal-g5 .cal-day-name { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="topbar" id="dcr2Topbar"></div>

    <div class="ts-app ts-theme" id="timesheetApp">
      <div class="ts-section">
        <div class="ts-head">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--acc)"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <h2>Employee Time Sheet</h2>
          <span style="flex:1"></span>
          <a class="btn btn-ghost btn-sm" id="tsPhoneLink" href="timesheet-mobile.html" hidden>📱 Phone view</a>
          <a class="btn btn-ghost btn-sm" href="report-timecard.html">🖨 Time card</a>
          <button type="button" id="tsPdfBtn" class="btn btn-ghost btn-sm" title="Send a timesheet as a PDF">📄 Send as PDF</button>
        </div>

        <div id="tsReadOnly" class="ts-ro" hidden></div>
        <form class="ts-grid" id="tsForm" novalidate autocomplete="off">
          <div class="ts-full">
            <label class="ts-label" for="tsDayType">Day type *</label>
            <select id="tsDayType" class="ts-input">
              <option value="work">Worked</option>
              <option value="holiday">Holiday</option>
              <option value="vacation">Vacation</option>
              <option value="sick">Sick day</option>
              <option value="day_off">Day off</option>
            </select>
          </div>
          <div>
            <label class="ts-label" for="tsName">Employee name *</label>
            <div class="emp-combo" id="empCombo">
              <input id="tsName" type="text" class="ts-input" placeholder="Type to search employee…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="empDropdown" />
              <div class="emp-dropdown" id="empDropdown" role="listbox"></div>
            </div>
            <div id="empScopeNote" class="ts-note"></div>
          </div>
          <div id="tsProjField">
            <label class="ts-label" for="tsProject">Project *</label>
            <input id="tsProject" type="text" class="ts-input" list="tsProjList" placeholder="Pick a project (number or name)" />
            <datalist id="tsProjList"></datalist>
            <div id="tsProjNote" class="ts-note"></div>
          </div>
          <div>
            <label class="ts-label" for="tsDate">Date *</label>
            <input id="tsDate" type="date" class="ts-input" />
          </div>
          <div>
            <label class="ts-label" for="tsHours">Hours worked *</label>
            <div class="hrs-control">
              <button type="button" class="hrs-btn hrs-btn-minus" id="hrsMinus" title="Subtract 30 min" aria-label="Subtract 30 minutes">&minus;</button>
              <input id="tsHours" type="text" class="hrs-input" value="0" inputmode="decimal" />
              <button type="button" class="hrs-btn hrs-btn-plus" id="hrsPlus" title="Add 30 min" aria-label="Add 30 minutes">&plus;</button>
            </div>
          </div>

          <div class="ts-full" id="tsScheduleSection" style="display:none;">
            <div class="ts-schedule">
              <div class="ts-schedule-title">Work Schedule</div>
              <div class="ts-schedule-grid">
                <div class="ts-schedule-session">
                  <div class="ts-schedule-session-title">Morning</div>
                  <div class="ts-time-row"><label class="ts-time-label" for="tsStart1">Start</label><input type="time" class="ts-time-input" id="tsStart1" /></div>
                  <div class="ts-time-row"><label class="ts-time-label" for="tsEnd1">End</label><input type="time" class="ts-time-input" id="tsEnd1" /></div>
                </div>
                <div class="ts-schedule-session">
                  <div class="ts-schedule-session-title lunch">Lunch Break</div>
                  <div class="ts-time-row"><label class="ts-time-label" for="tsLunch">Hours</label><input type="text" class="ts-lunch-input" id="tsLunch" value="1" inputmode="decimal" /></div>
                  <div class="ts-note" id="tsLunchRange"></div>
                </div>
                <div class="ts-schedule-session">
                  <div class="ts-schedule-session-title">Afternoon</div>
                  <div class="ts-time-row"><label class="ts-time-label" for="tsStart2">Start</label><input type="time" class="ts-time-input" id="tsStart2" /></div>
                  <div class="ts-time-row"><label class="ts-time-label" for="tsEnd2">End</label><input type="time" class="ts-time-input" id="tsEnd2" /></div>
                </div>
              </div>
              <div id="tsTimeline"></div>
              <div id="tsCalcBar"></div>
            </div>
          </div>

          <div class="ts-full">
            <label class="ts-label" for="tsWork">Work completed</label>
            <textarea id="tsWork" class="ts-input" rows="3" maxlength="2000" style="resize:vertical;" placeholder="Describe the work completed today…"></textarea>
          </div>
          <div class="ts-full" style="display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;">
            <button class="btn-primary" type="submit" id="submitBtn">&#10003; Submit time sheet</button>
            <button class="btn-secondary" type="button" id="cancelBtn" hidden>Cancel edit</button>
            <span id="formMsg" role="status" style="font-size:13px;"></span>
          </div>
        </form>
      </div>

      <div class="ts-section">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;gap:8px;flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--acc)"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span style="font-size:16px;font-weight:700;">Two-week calendar</span>
          </div>
          <button class="btn-secondary" type="button" id="calRefresh" style="font-size:12px;padding:6px 14px;">&#8635; Refresh</button>
        </div>
        <p style="font-size:13px;color:var(--text-muted);margin:0 0 1rem;">
          <span id="calHint">Click any day to pre-fill the date. Blue days have entries.</span>
          <span id="calFilterNote" style="color:var(--acc);font-weight:600;"></span>
        </p>
        <div id="calArea"><div style="color:var(--text-muted);font-size:14px;">Loading calendar…</div></div>
      </div>
      <div id="modalContainer"></div>
    </div>

    <script type="module" src="js/pages/timesheet.js"></script>
  </body>
</html>
